; CrosshairHealth - draws GTA IV's target health ring back while C06alt's First Person Mod
; is providing the view. Every value is optional; anything left out keeps the built-in
; default. Sizes and offsets are in pixels at 1440p and scale with screen height.
[Settings]

; 1 draws the ring, 0 draws nothing. Turn this off when using ZMenu IV's first person
; instead: ZMenu keeps the game's own reticule, which already carries the health ring, so
; this would draw a second one on top of it.
Enabled = 1

; Radius of the ring. C06alt's circle is about 21 at this scale, so 14 sits inside it.
Radius = 17

; Thickness of the arc.
Thickness = 5

; Where C06alt puts its crosshair relative to the middle of the screen. It draws above
; centre, so the ring is nudged up to match. Negative Y is up, negative X is left.
OffsetX = 0
OffsetY = -28

; How long a wounded target keeps its ring after the game stops reporting it, in
; milliseconds. The target lookup is not steady: it drops out for up to about 1.75 seconds
; at a time while a ped is squarely under the crosshair, which makes the ring flicker out
; mid-fight. Only peds that have actually been hurt are held. 0 turns this off.
TargetHoldMs = 2000

; How far off the middle of the view a held target may drift before the hold is dropped, in
; degrees. This is what stops the ring following a wounded ped around after you have
; deliberately aimed somewhere else: the hold bridges a lookup that blinks out, nothing
; more. Larger is more forgiving of a shaky aim, smaller drops the ring sooner.
HoldConeDegrees = 6

; 1 draws the ring at all times regardless of aiming, and writes crosshairhealth.log once
; a second. For working out sizes and offsets, not for playing.
Debug = 0

; Probe mode: logs where the aimed-at ped keeps its health, to find the max-health
; field. Aim at someone, shoot them once, quit, then turn this back off.
Probe = 0

; ---------------------------------------------------------------------------------------
; Memory offsets. Hex, with or without an 0x prefix. These only need touching on a game or
; mod build other than the one they were found on: GTA IV 1.0.7.0 with C06alt First Person
; v1.3 (420352 bytes). A bad value is ignored and the default kept.
;
; Complete Edition is the likely reason to change them. The three C06alt offsets are inside
; FirstPerson.asi and should carry over if the same build is used there, because they are
; relative to that module rather than to the game. MaxHealthOffset is a CPed field and
; belongs to the game version, so expect it to move on 1.2.0.59. Set Probe = 1 to find it:
; aim at someone, shoot them, and read crosshairhealth.log for the offset that holds steady
; while the reported health falls.

; Maximum health on a ped, a float at this offset from the ped.
MaxHealthOffset = 0x110

; C06alt's static state object, relative to the FirstPerson.asi module base.
FpObjectRva = 0x5d9d0

; The three bytes of that object which decide whether its crosshair is drawn.
FlagOnFootOffset = 0x155
FlagInVehicleOffset = 0x15a
FlagSuppressedOffset = 0x112
