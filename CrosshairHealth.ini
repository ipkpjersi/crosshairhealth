; CrosshairHealth - draws GTA IV's target health ring back while C06alt's First Person Mod
; is providing the view. Every value is optional; anything left out keeps the built-in
; default. Sizes and offsets are in pixels at 1440p and scale with screen height.
[Settings]

; 1 draws the ring, 0 draws nothing. Turn this off when using ZMenu IV's first person
; instead: ZMenu keeps the game's own reticule, which already carries the health ring, so
; this would draw a second one on top of it.
Enabled = 1

; Radius of the ring. C06alt's circle is about 21 at this scale, so 14 sits inside it.
Radius = 17

; Thickness of the arc.
Thickness = 5

; Where C06alt puts its crosshair relative to the middle of the screen. It draws above
; centre, so the ring is nudged up to match. Negative Y is up, negative X is left.
OffsetX = 0
OffsetY = -28

; 1 draws the ring at all times regardless of aiming, and writes crosshairhealth.log once
; a second. For working out sizes and offsets, not for playing.
Debug = 0

; Probe mode: logs where the aimed-at ped keeps its health, to find the max-health
; field. Aim at someone, shoot them once, quit, then turn this back off.
Probe = 0
